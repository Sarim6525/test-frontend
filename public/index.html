<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme -->
    <meta name="theme-color" content="#0a0a0f" />

    <!-- SEO -->
    <meta
      name="description"
      content="A modern, powerful and beautifully designed React application."
    />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>🚀 My Awesome App</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        padding: 0;
        background: #08080d;
        color: #ffffff;
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
      }

      /* Smooth loading screen */
      .initial-loader {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background:
          radial-gradient(
            circle at 20% 20%,
            rgba(98, 0, 255, 0.25),
            transparent 30%
          ),
          radial-gradient(
            circle at 80% 70%,
            rgba(0, 183, 255, 0.2),
            transparent 30%
          ),
          #08080d;
      }

      .loader-logo {
        font-family: "Space Grotesk", sans-serif;
        font-size: 2.5rem;
        font-weight: 700;
        letter-spacing: -1px;
        background: linear-gradient(90deg, #7c3aed, #06b6d4, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .loader-bar {
        width: 180px;
        height: 4px;
        margin-top: 20px;
        border-radius: 20px;
        background: #1f1f2a;
        overflow: hidden;
      }

      .loader-progress {
        width: 40%;
        height: 100%;
        border-radius: 20px;
        background: linear-gradient(90deg, #7c3aed, #06b6d4);
        animation: loading 1.2s infinite ease-in-out;
      }

      @keyframes loading {
        0% {
          transform: translateX(-100%);
        }

        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this application.
    </noscript>

    <div id="root">
      <div class="initial-loader">
        <div class="loader-logo">Launching Experience 🚀</div>

        <div class="loader-bar">
          <div class="loader-progress"></div>
        </div>
      </div>
    </div>
  </body>
</html>
